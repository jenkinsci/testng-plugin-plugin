<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Document Base Gradient -->
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#dfdfdf"/>
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#e68a00"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33aadd"/>
      <stop offset="100%" stop-color="#0066bb"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aadd44"/>
      <stop offset="100%" stop-color="#559911"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Bottom Shadow -->
  <ellipse cx="67" cy="115" rx="42" ry="6" fill="#000000" opacity="0.2" filter="url(#blur)"/>

  <!-- Main Document Base -->
  <path d="M 38 15 
           L 80 15 
           L 105 40 
           L 105 105 
           A 8 8 0 0 1 97 113 
           L 38 113 
           A 8 8 0 0 1 30 105 
           L 30 23 
           A 8 8 0 0 1 38 15 Z" 
        fill="url(#docGrad)" 
        stroke="#cccccc" 
        stroke-width="1"/>

  <!-- Folded Corner -->
  <path d="M 80 15 
           L 80 32 
           A 8 8 0 0 0 88 40 
           L 105 40 
           Z" 
        fill="url(#foldGrad)"/>

  <!-- Fold Shadow Effect -->
  <path d="M 80 15 L 80 32 A 8 8 0 0 0 88 40 L 105 40" fill="none" stroke="#b3b3b3" stroke-width="1"/>

  <!-- Horizontal Document Lines -->
  <g fill="#cfcfcf">
    <rect x="38" y="32" width="38" height="3" rx="1.5"/>
    <rect x="38" y="44" width="59" height="3" rx="1.5"/>
    <rect x="38" y="56" width="59" height="3" rx="1.5"/>
    <rect x="38" y="68" width="59" height="3" rx="1.5"/>
    <rect x="38" y="80" width="59" height="3" rx="1.5"/>
    <rect x="38" y="92" width="59" height="3" rx="1.5"/>
  </g>

  <!-- Bar Chart Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Orange Bar -->
    <rect x="42" y="66" width="16" height="38" rx="4" fill="url(#orangeGrad)"/>
    <rect x="43.5" y="67.5" width="13" height="35" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

    <!-- Blue Bar -->
    <rect x="60" y="40" width="16" height="64" rx="4" fill="url(#blueGrad)"/>
    <rect x="61.5" y="41.5" width="13" height="61" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>

    <!-- Green Bar -->
    <rect x="78" y="54" width="16" height="50" rx="4" fill="url(#greenGrad)"/>
    <rect x="79.5" y="55.5" width="13" height="47" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
